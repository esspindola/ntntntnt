  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"81a22da8-ea4d-4bed-8314-e0f39cb9fca0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"234b33cb-20ef-4b3b-a0fe-5bab7a585dd4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d9406960-1aff-43a4-9f2b-008371251646\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ---------- Tokens ---------- */\n:root {\n  /* light palette */\n  --bg:        oklch(0.972 0.003 95);\n  --bg-2:      oklch(0.945 0.004 95);\n  --surface:   oklch(0.99 0.002 95);\n  --ink:       oklch(0.165 0.006 270);\n  --ink-soft:  oklch(0.34 0.006 270);\n  --gray:      oklch(0.58 0.005 270);\n  --gray-2:    oklch(0.72 0.004 270);\n  --line:      oklch(0.86 0.004 270);\n  --line-2:    oklch(0.91 0.003 270);\n  --red:       oklch(0.605 0.232 26);\n  --red-deep:  oklch(0.52 0.21 26);\n\n  /* type */\n  --font-display: 'Archivo', system-ui, sans-serif;\n  --font-body:    'Archivo', system-ui, sans-serif;\n  --font-mono:    'Space Mono', ui-monospace, monospace;\n\n  /* widths */\n  --wide: 88rem;\n  --maxpad: clamp(1.25rem, 5vw, 6rem);\n\n  --ease: cubic-bezier(0.22, 1, 0.36, 1);\n}\n\n/* ---------- Reset ---------- */\n*, *::before, *::after { box-sizing: border-box; }\n* { margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }\nbody {\n  font-family: var(--font-body);\n  background: var(--bg);\n  color: var(--ink);\n  line-height: 1.5;\n  font-weight: 420;\n  letter-spacing: -0.01em;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n}\nimg { display: block; max-width: 100%; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }\nul { list-style: none; }\n\n/* ---------- Type helpers ---------- */\n.display {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-variation-settings: 'wdth' 122;\n  line-height: 0.88;\n  letter-spacing: -0.03em;\n  text-transform: uppercase;\n  text-wrap: balance;\n}\n.kicker, .eyebrow {\n  font-family: var(--font-mono);\n  font-size: clamp(0.66rem, 0.9vw, 0.8rem);\n  font-weight: 400;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--gray);\n}\n.kicker .dot, .eyebrow .dot { color: var(--red); }\n.lede {\n  font-size: clamp(1.05rem, 1.7vw, 1.5rem);\n  line-height: 1.45;\n  color: var(--ink-soft);\n  font-weight: 440;\n  letter-spacing: -0.015em;\n  max-width: 46ch;\n  text-wrap: pretty;\n}\n.jp {\n  font-family: var(--font-mono);\n  letter-spacing: 0.1em;\n}\n\n/* ---------- Layout ---------- */\n.wrap { width: 100%; max-width: var(--wide); margin-inline: auto; padding-inline: var(--maxpad); }\n.section { padding-block: clamp(4.5rem, 11vw, 11rem); }\n.section--tight { padding-block: clamp(3rem, 7vw, 6rem); }\n\n.section__head {\n  display: flex;\n  align-items: flex-end;\n  justify-content: space-between;\n  gap: 2rem;\n  flex-wrap: wrap;\n  border-top: 1px solid var(--line);\n  padding-top: 1.5rem;\n  margin-bottom: clamp(2.5rem, 5vw, 4.5rem);\n}\n.section__title {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-variation-settings: 'wdth' 118;\n  text-transform: uppercase;\n  letter-spacing: -0.025em;\n  line-height: 0.9;\n  font-size: clamp(2.4rem, 6.5vw, 6rem);\n}\n.section__index { font-family: var(--font-mono); font-size: 0.8rem; color: var(--gray); letter-spacing: 0.2em; }\n\n/* ---------- Nav ---------- */\n.nav {\n  position: fixed; inset: 0 0 auto 0; z-index: 100;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: clamp(1rem, 2vw, 1.6rem) var(--maxpad);\n  background: color-mix(in oklab, var(--bg) 72%, transparent);\n  backdrop-filter: blur(18px) saturate(1.2);\n  -webkit-backdrop-filter: blur(18px) saturate(1.2);\n  border-bottom: 1px solid transparent;\n  transition: border-color 0.4s var(--ease), background 0.4s var(--ease);\n}\n.nav.is-scrolled { border-bottom-color: var(--line); }\n.nav__brand {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-variation-settings: 'wdth' 120;\n  text-transform: uppercase;\n  letter-spacing: -0.02em;\n  font-size: 1.15rem;\n  display: inline-flex; align-items: center; gap: 0.45rem;\n}\n.nav__brand .dot { width: 0.42rem; height: 0.42rem; border-radius: 50%; background: var(--red); display: inline-block; }\n.nav__links { display: flex; align-items: center; gap: clamp(1.4rem, 3vw, 2.8rem); }\n.nav__links a {\n  font-family: var(--font-mono);\n  font-size: 0.74rem; letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--ink-soft); position: relative; padding-block: 0.4rem;\n  transition: color 0.25s var(--ease);\n}\n.nav__links a::after {\n  content: ''; position: absolute; left: 0; bottom: 0; height: 1px; width: 0;\n  background: var(--red); transition: width 0.3s var(--ease);\n}\n.nav__links a:hover { color: var(--ink); }\n.nav__links a:hover::after, .nav__links a[aria-current=\"page\"]::after { width: 100%; }\n.nav__links a[aria-current=\"page\"] { color: var(--ink); }\n\n.nav__toggle { display: none; width: 2.4rem; height: 2.4rem; position: relative; }\n.nav__toggle span { position: absolute; left: 0.4rem; right: 0.4rem; height: 2px; background: var(--ink); transition: transform 0.3s var(--ease), opacity 0.2s; }\n.nav__toggle span:nth-child(1) { top: 0.8rem; }\n.nav__toggle span:nth-child(2) { bottom: 0.8rem; }\nbody.menu-open .nav__toggle span:nth-child(1) { transform: translateY(0.35rem) rotate(45deg); }\nbody.menu-open .nav__toggle span:nth-child(2) { transform: translateY(-0.35rem) rotate(-45deg); }\n\n/* ---------- Buttons ---------- */\n.cta-row { display: flex; flex-wrap: wrap; gap: 0.9rem; }\n.btn {\n  display: inline-flex; align-items: center; gap: 0.7rem;\n  font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase;\n  padding: 1.05rem 1.7rem; border-radius: 0; border: 1px solid var(--ink);\n  transition: background 0.3s var(--ease), color 0.3s var(--ease), border-color 0.3s var(--ease), transform 0.3s var(--ease);\n}\n.btn .arw { transition: transform 0.3s var(--ease); }\n.btn:hover .arw { transform: translateX(0.3rem); }\n.btn--primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n.btn--primary:hover { background: var(--red); border-color: var(--red); color: #fff; }\n.btn--ghost { background: transparent; color: var(--ink); }\n.btn--ghost:hover { background: var(--ink); color: var(--bg); }\n.btn--red { background: var(--red); border-color: var(--red); color: #fff; }\n.btn--red:hover { background: var(--red-deep); border-color: var(--red-deep); }\n\n/* ---------- Media placeholder ---------- */\n.media {\n  position: relative; overflow: hidden;\n  background: var(--bg-2);\n  border: 1px solid var(--line);\n  isolation: isolate;\n}\n.media::before {\n  content: ''; position: absolute; inset: 0; z-index: 0;\n  background-image:\n    repeating-linear-gradient(135deg,\n      color-mix(in oklab, var(--ink) 7%, transparent) 0 1px,\n      transparent 1px 13px);\n}\n.media::after {\n  content: ''; position: absolute; inset: 0; z-index: 0;\n  background:\n    radial-gradient(120% 90% at 80% 10%, color-mix(in oklab, var(--ink) 5%, transparent), transparent 60%);\n}\n.media__tag {\n  position: absolute; z-index: 2; left: 1rem; bottom: 1rem;\n  font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;\n  color: var(--ink-soft);\n  background: color-mix(in oklab, var(--bg) 80%, transparent);\n  border: 1px solid var(--line);\n  padding: 0.4rem 0.6rem;\n  backdrop-filter: blur(4px);\n}\n.media__tag .dot { color: var(--red); }\n.media__corner {\n  position: absolute; z-index: 2; top: 1rem; right: 1rem;\n  font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.2em; color: var(--gray);\n}\n.ar-21 { aspect-ratio: 21 / 9; }\n.ar-169 { aspect-ratio: 16 / 9; }\n.ar-43 { aspect-ratio: 4 / 3; }\n.ar-11 { aspect-ratio: 1 / 1; }\n.ar-34 { aspect-ratio: 3 / 4; }\n.ar-23 { aspect-ratio: 2 / 3; }\n\n/* dark media variant */\n.media--dark {\n  background: oklch(0.22 0.006 270);\n  border-color: oklch(0.32 0.006 270);\n}\n.media--dark::before {\n  background-image: repeating-linear-gradient(135deg,\n    color-mix(in oklab, #fff 8%, transparent) 0 1px, transparent 1px 13px);\n}\n.media--dark::after { background: radial-gradient(120% 90% at 80% 10%, color-mix(in oklab,#fff 6%, transparent), transparent 60%); }\n.media--dark .media__tag { color: oklch(0.8 0.01 90); background: color-mix(in oklab, oklch(0.18 0.006 270) 70%, transparent); border-color: oklch(0.34 0.006 270); }\n\n/* ---------- Footer ---------- */\n.footer { border-top: 1px solid var(--line); padding-block: clamp(3rem, 6vw, 5rem) 2.5rem; }\n.footer__top { display: flex; justify-content: space-between; gap: 3rem; flex-wrap: wrap; margin-bottom: 4rem; }\n.footer__brand { font-family: var(--font-display); font-weight: 800; font-variation-settings: 'wdth' 122; text-transform: uppercase; letter-spacing: -0.03em; line-height: 0.85; font-size: clamp(3rem, 12vw, 11rem); }\n.footer__cols { display: flex; gap: clamp(2rem, 6vw, 5rem); flex-wrap: wrap; }\n.footer__col h4 { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); margin-bottom: 1rem; font-weight: 400; }\n.footer__col a { display: block; padding: 0.32rem 0; font-size: 0.95rem; color: var(--ink-soft); transition: color 0.2s; }\n.footer__col a:hover { color: var(--red); }\n.footer__bar { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 1.6rem; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); }\n\n/* ---------- Reveal ---------- */\n.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }\n.reveal.in { opacity: 1; transform: none; }\n.reveal[data-d=\"1\"] { transition-delay: 0.08s; }\n.reveal[data-d=\"2\"] { transition-delay: 0.16s; }\n.reveal[data-d=\"3\"] { transition-delay: 0.24s; }\n@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }\n\n/* =========================================================\n   HERO\n   ========================================================= */\n.hero { position: relative; min-height: 100svh; display: flex; flex-direction: column; gap: clamp(1.5rem, 4vh, 4rem); padding-top: clamp(5.5rem, 10vh, 9rem); padding-bottom: clamp(2.5rem, 6vw, 5rem); overflow: hidden; }\n.hero__bg { position: absolute; inset: 0; z-index: 0; }\n.hero__bg .media { position: absolute; inset: 0; border: none; }\n.hero__scrim { position: absolute; inset: 0; z-index: 1; background:\n  linear-gradient(180deg, color-mix(in oklab,var(--bg) 35%, transparent) 0%, transparent 22%, transparent 55%, color-mix(in oklab,var(--bg) 88%, transparent) 100%); }\n.hero__inner { position: relative; z-index: 2; width: 100%; margin-top: auto; }\n.hero__top { position: relative; z-index: 2; width: 100%; }\n.hero__meta { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }\n.hero__title { font-size: clamp(2.7rem, 15.5vw, 18rem); overflow-wrap: anywhere; }\n.hero__sub { margin-top: clamp(1.2rem, 2.5vw, 2rem); display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; flex-wrap: wrap; }\n.hero__scroll { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); display: inline-flex; align-items: center; gap: 0.6rem; }\n.hero__scroll .ln { width: 2.4rem; height: 1px; background: var(--gray); display: inline-block; }\n\n/* =========================================================\n   GRID PRIMITIVES\n   ========================================================= */\n.cols { display: grid; gap: clamp(1.25rem, 2.5vw, 2.4rem); }\n.cols-2 { grid-template-columns: repeat(2, 1fr); }\n.cols-3 { grid-template-columns: repeat(3, 1fr); }\n.cols-4 { grid-template-columns: repeat(4, 1fr); }\n.span-2 { grid-column: span 2; }\n\n/* Intro / statement */\n.statement { display: grid; grid-template-columns: 1fr 1.1fr; gap: clamp(2rem,6vw,5rem); align-items: start; }\n.statement__big { font-family: var(--font-display); font-weight: 760; font-variation-settings: 'wdth' 100; font-size: clamp(1.8rem, 3.4vw, 3.2rem); line-height: 1.06; letter-spacing: -0.02em; text-wrap: balance; }\n.statement__big em { font-style: italic; color: var(--red); }\n.statement__side p { color: var(--ink-soft); font-size: 1.05rem; margin-bottom: 1.2rem; max-width: 42ch; }\n\n/* =========================================================\n   CATEGORY / INDEX ROWS\n   ========================================================= */\n.index-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: clamp(1rem,3vw,3rem); align-items: center; padding: clamp(1.6rem, 3vw, 2.6rem) 0; border-top: 1px solid var(--line); transition: padding-left 0.4s var(--ease); position: relative; }\n.index-row:last-child { border-bottom: 1px solid var(--line); }\n.index-row:hover { padding-left: 1.2rem; }\n.index-row__no { font-family: var(--font-mono); font-size: 0.8rem; color: var(--gray); letter-spacing: 0.1em; }\n.index-row__title { font-family: var(--font-display); font-weight: 800; font-variation-settings: 'wdth' 116; text-transform: uppercase; letter-spacing: -0.02em; font-size: clamp(2rem, 6vw, 5rem); line-height: 0.92; transition: color 0.3s var(--ease); }\n.index-row:hover .index-row__title { color: var(--red); }\n.index-row__meta { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); text-align: right; max-width: 18ch; }\n.index-row__arw { font-size: 1.6rem; transition: transform 0.35s var(--ease); }\n.index-row:hover .index-row__arw { transform: translateX(0.5rem); color: var(--red); }\n\n/* =========================================================\n   CARDS\n   ========================================================= */\n.card { display: flex; flex-direction: column; gap: 1.1rem; }\n.card__media { position: relative; overflow: hidden; }\n.card__media .media { width: 100%; height: 100%; transition: transform 0.7s var(--ease); }\n.card:hover .card__media .media { transform: scale(1.035); }\n.card__head { display: flex; align-items: baseline; gap: 0.8rem; }\n.card__no { font-family: var(--font-mono); font-size: 0.72rem; color: var(--red); letter-spacing: 0.1em; }\n.card__title { font-family: var(--font-display); font-weight: 780; font-variation-settings: 'wdth' 112; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.95; font-size: clamp(1.4rem, 2.6vw, 2.2rem); }\n.card__meta { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); }\n.card__desc { color: var(--ink-soft); font-size: 0.98rem; max-width: 40ch; }\n.card__media .badge {\n  position: absolute; z-index: 3; top: 1rem; left: 1rem;\n  font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;\n  background: var(--red); color: #fff; padding: 0.35rem 0.6rem;\n}\n\n/* Big editorial feature (asymmetric) */\n.feature { display: grid; grid-template-columns: 1.4fr 1fr; gap: clamp(1.5rem, 4vw, 3.5rem); align-items: center; }\n.feature--rev { grid-template-columns: 1fr 1.4fr; }\n.feature--rev .feature__text { order: 2; }\n.feature__text h3 { font-family: var(--font-display); font-weight: 800; font-variation-settings: 'wdth' 116; text-transform: uppercase; letter-spacing: -0.025em; line-height: 0.9; font-size: clamp(2rem, 5vw, 4rem); margin-bottom: 1.4rem; }\n.feature__text p { color: var(--ink-soft); font-size: 1.05rem; max-width: 44ch; margin-bottom: 1.6rem; }\n.feature__stats { display: flex; gap: 2.5rem; margin-top: 2rem; flex-wrap: wrap; }\n.stat__num { font-family: var(--font-display); font-weight: 800; font-variation-settings: 'wdth' 110; font-size: clamp(1.8rem, 3.5vw, 2.8rem); letter-spacing: -0.02em; line-height: 1; }\n.stat__lab { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray); margin-top: 0.5rem; }\n\n/* =========================================================\n   DARK PAGE THEME (Gastronomy)\n   ========================================================= */\nbody.theme-dark {\n  --bg:        oklch(0.155 0.006 270);\n  --bg-2:      oklch(0.20 0.006 270);\n  --surface:   oklch(0.19 0.006 270);\n  --ink:       oklch(0.96 0.004 90);\n  --ink-soft:  oklch(0.78 0.006 90);\n  --gray:      oklch(0.62 0.006 270);\n  --gray-2:    oklch(0.5 0.006 270);\n  --line:      oklch(0.30 0.006 270);\n  --line-2:    oklch(0.26 0.006 270);\n}\nbody.theme-dark .media { background: var(--bg-2); border-color: var(--line); }\nbody.theme-dark .media::before { background-image: repeating-linear-gradient(135deg, color-mix(in oklab,#fff 7%, transparent) 0 1px, transparent 1px 13px); }\nbody.theme-dark .media::after { background: radial-gradient(120% 90% at 80% 10%, color-mix(in oklab,#fff 6%, transparent), transparent 60%); }\nbody.theme-dark .media__tag { color: var(--ink-soft); background: color-mix(in oklab, var(--bg) 70%, transparent); border-color: var(--line); }\nbody.theme-dark .nav { background: color-mix(in oklab, var(--bg) 70%, transparent); }\nbody.theme-dark .btn--primary { background: var(--ink); color: var(--bg); }\nbody.theme-dark .btn--primary:hover { background: var(--red); color: #fff; }\nbody.theme-dark .btn { border-color: var(--ink); }\nbody.theme-dark .nav__toggle span { background: var(--ink); }\n\n/* =========================================================\n   BOOKING / PRICE (Hotels)\n   ========================================================= */\n.hotel { display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(1.5rem,3vw,2.5rem); align-items: stretch; border-top: 1px solid var(--line); padding-top: clamp(1.5rem,3vw,2.5rem); }\n.hotel__media { position: relative; }\n.hotel__info { display: flex; flex-direction: column; }\n.hotel__cat { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--red); margin-bottom: 1rem; }\n.hotel__name { font-family: var(--font-display); font-weight: 800; font-variation-settings: 'wdth' 114; text-transform: uppercase; letter-spacing: -0.025em; line-height: 0.92; font-size: clamp(1.8rem, 3.6vw, 3rem); margin-bottom: 1rem; }\n.hotel__desc { color: var(--ink-soft); font-size: 1rem; max-width: 40ch; margin-bottom: 1.6rem; }\n.hotel__feat { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: auto; }\n.chip { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); border: 1px solid var(--line); padding: 0.4rem 0.7rem; }\n.hotel__book { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--line); margin-top: 2rem; padding-top: 1.4rem; flex-wrap: wrap; }\n.price { display: flex; flex-direction: column; }\n.price__num { font-family: var(--font-display); font-weight: 800; font-variation-settings: 'wdth' 110; font-size: clamp(1.8rem, 3.5vw, 2.6rem); letter-spacing: -0.02em; line-height: 1; }\n.price__num small { font-size: 0.42em; font-weight: 600; color: var(--gray); letter-spacing: 0; }\n.price__lab { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); margin-top: 0.5rem; }\n\n/* =========================================================\n   RESPONSIVE\n   ========================================================= */\n@media (max-width: 1024px) {\n  .feature, .feature--rev { grid-template-columns: 1fr; }\n  .feature--rev .feature__text { order: 0; }\n  .statement { grid-template-columns: 1fr; }\n  .cols-4 { grid-template-columns: repeat(2, 1fr); }\n  .hotel { grid-template-columns: 1fr; }\n  /* Narrow the giant hero letterforms so single words never overflow at tablet widths */\n  .hero__title { font-variation-settings: 'wdth' 100; font-size: clamp(2.7rem, 13.5vw, 12rem); }\n}\n@media (max-width: 760px) {\n  :root { --maxpad: 1.25rem; }\n  .nav__links {\n    position: fixed; inset: 0 0 0 auto; width: min(82vw, 360px);\n    flex-direction: column; align-items: flex-start; justify-content: center; gap: 1.6rem;\n    background: var(--bg); border-left: 1px solid var(--line);\n    padding: 2rem; transform: translateX(110%); transition: transform 0.45s var(--ease);\n    z-index: 99;\n  }\n  body.menu-open .nav__links { transform: none; }\n  .nav__links a { font-size: 1rem; }\n  .nav__toggle { display: block; z-index: 101; }\n  .cols-2, .cols-3 { grid-template-columns: 1fr; }\n  .span-2 { grid-column: auto; }\n  .index-row { grid-template-columns: auto 1fr auto; }\n  .index-row__meta { display: none; }\n  .hero__sub { align-items: flex-start; }\n  /* Hero on mobile: narrower letterforms + contained size so the giant title never overflows */\n  .hero { min-height: 86svh; padding-top: clamp(5rem, 9vh, 7rem); }\n  .hero__title { font-size: clamp(2.6rem, 16vw, 6.5rem); font-variation-settings: 'wdth' 100; line-height: 0.92; }\n  .hero__top .hero__meta { flex-direction: column; gap: 0.4rem; }\n}\n@media (max-width: 460px) {\n  .cols-4 { grid-template-columns: 1fr; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- NAV -->\n<nav class=\"nav\">\n  <a class=\"nav__brand\" href=\"Home.html\">TOKYO<span class=\"dot\"><\u002Fspan><\u002Fa>\n  <ul class=\"nav__links\">\n    <li><a href=\"Home.html\" aria-current=\"page\">Home<\u002Fa><\u002Fli>\n    <li><a href=\"Tourism.html\">Tourism<\u002Fa><\u002Fli>\n    <li><a href=\"Gastronomy.html\">Gastronomy<\u002Fa><\u002Fli>\n    <li><a href=\"Hotels.html\">Hotels<\u002Fa><\u002Fli>\n  <\u002Ful>\n  <button class=\"nav__toggle\" aria-label=\"Menu\" aria-expanded=\"false\"><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n<\u002Fnav>\n\n<!-- HERO -->\n<header class=\"hero\">\n  <div class=\"hero__bg\">\n    <div class=\"media\">\n      <span class=\"media__tag\"><span class=\"dot\">●<\u002Fspan>&nbsp; FULL-BLEED HERO — TOKYO SKYLINE AT DUSK, SHIBUYA<\u002Fspan>\n      <span class=\"media__corner\">01 / 04<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero__scrim\"><\u002Fdiv>\n\n  <div class=\"hero__top wrap\">\n    <div class=\"hero__meta\">\n      <span class=\"kicker\"><span class=\"dot\">●<\u002Fspan> 東京 — TOKYO, JAPAN<\u002Fspan>\n      <span class=\"kicker\">35.6764° N · 139.6500° E<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hero__inner wrap\">\n    <h1 class=\"display hero__title\">Discover<br>Tokyo<\u002Fh1>\n    <div class=\"hero__sub\">\n      <p class=\"lede\">Where tradition meets the future — a city of quiet temples, electric nights and the world's most considered design.<\u002Fp>\n      <span class=\"hero__scroll\"><span class=\"ln\"><\u002Fspan> Scroll to explore<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"cta-row\" style=\"margin-top:2rem;\">\n      <a class=\"btn btn--primary\" href=\"Tourism.html\">Start exploring <span class=\"arw\">→<\u002Fspan><\u002Fa>\n      <a class=\"btn btn--ghost\" href=\"#categories\">View experiences<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- STATEMENT -->\n<section class=\"section\">\n  <div class=\"wrap\">\n    <div class=\"statement\">\n      <p class=\"statement__big reveal\">A metropolis of <em>thirteen million<\u002Fem> stories — engineered to the millimetre, yet built around stillness.<\u002Fp>\n      <div class=\"statement__side reveal\" data-d=\"1\">\n        <p>Tokyo rewards the curious. Step from a neon-soaked crossing into a four-hundred-year-old garden in the space of a single block.<\u002Fp>\n        <p>This guide moves through the three ways to know the city — its places, its food, and the rooms you'll sleep in.<\u002Fp>\n        <span class=\"kicker\">Curated · 2026 Edition<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FEATURED EXPERIENCES -->\n<section class=\"section section--tight\">\n  <div class=\"wrap\">\n    <div class=\"section__head reveal\">\n      <h2 class=\"section__title\">Featured<br>Experiences<\u002Fh2>\n      <span class=\"section__index\">— 03 SELECTED<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cols cols-3\">\n      <article class=\"card reveal\">\n        <a class=\"card__media ar-34\" href=\"Tourism.html\">\n          <div class=\"media\">\n            <span class=\"badge\">Iconic<\u002Fspan>\n            <span class=\"media__tag\"><span class=\"dot\">●<\u002Fspan>&nbsp; SHIBUYA CROSSING — NIGHT<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n        <div class=\"card__head\"><span class=\"card__no\">01<\u002Fspan><h3 class=\"card__title\">The Crossing<\u002Fh3><\u002Fdiv>\n        <p class=\"card__desc\">Three thousand people, one perfectly choreographed moment — the world's busiest intersection.<\u002Fp>\n        <span class=\"card__meta\">Shibuya · After dark<\u002Fspan>\n      <\u002Farticle>\n\n      <article class=\"card reveal\" data-d=\"1\">\n        <a class=\"card__media ar-34\" href=\"Gastronomy.html\">\n          <div class=\"media\">\n            <span class=\"badge\">Taste<\u002Fspan>\n            <span class=\"media__tag\"><span class=\"dot\">●<\u002Fspan>&nbsp; OMAKASE COUNTER — SUSHI<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n        <div class=\"card__head\"><span class=\"card__no\">02<\u002Fspan><h3 class=\"card__title\">Omakase<\u002Fh3><\u002Fdiv>\n        <p class=\"card__desc\">Ten seats, one chef, no menu. Trust the hands that have shaped rice for forty years.<\u002Fp>\n        <span class=\"card__meta\">Ginza · Reservation only<\u002Fspan>\n      <\u002Farticle>\n\n      <article class=\"card reveal\" data-d=\"2\">\n        <a class=\"card__media ar-34\" href=\"Hotels.html\">\n          <div class=\"media\">\n            <span class=\"badge\">Stay<\u002Fspan>\n            <span class=\"media__tag\"><span class=\"dot\">●<\u002Fspan>&nbsp; RYOKAN SUITE — TATAMI &amp; ONSEN<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n        <div class=\"card__head\"><span class=\"card__no\">03<\u002Fspan><h3 class=\"card__title\">The Ryokan<\u002Fh3><\u002Fdiv>\n        <p class=\"card__desc\">A centuries-old ritual of hospitality, reimagined for the modern traveller.<\u002Fp>\n        <span class=\"card__meta\">Asakusa · From ¥48,000<\u002Fspan>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CATEGORIES -->\n<section class=\"section\" id=\"categories\">\n  <div class=\"wrap\">\n    <div class=\"section__head reveal\">\n      <h2 class=\"section__title\">Three Ways<br>To Know Tokyo<\u002Fh2>\n      <span class=\"section__index\">— INDEX 01–03<\u002Fspan>\n    <\u002Fdiv>\n\n    <nav class=\"cat-index\">\n      <a class=\"index-row reveal\" h lass=\"card__media ar-43\">\n        <div class=\"media\">\n          <span class=\"media__tag\"><span class=\"dot\">●<\u002Fspan>&nbsp; CONTRAST — SHRINE GATE BENEATH TOWERS<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer__top\">\n      <div class=\"footer__brand\">TOKYO<\u002Fdiv>\n      <div class=\"footer__cols\">\n        <div class=\"footer__col\">\n          <h4>Explore<\u002Fh4>\n          <a href=\"Tourism.html\">Tourism<\u002Fa>\n          <a href=\"Gastronomy.html\">Gastronomy<\u002Fa>\n          <a href=\"Hotels.html\">Hotels<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"footer__col\">\n          <h4>Plan<\u002Fh4>\n          <a href=\"#\">Getting around<\u002Fa>\n          <a href=\"#\">Seasons<\u002Fa>\n          <a href=\"#\">Etiquette<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"footer__col\">\n          <h4>Connect<\u002Fh4>\n          <a href=\"#\">Instagram<\u002Fa>\n          <a href=\"#\">Newsletter<\u002Fa>\n          <a href=\"#\">Press<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer__bar\">\n      <span>© 2026 Tokyo Guide — A travel experience<\u002Fspan>\n      <span>東京 · Tradition meets future<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<script src=\"56c71395-daaf-4a47-afc1-dad36732a102\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
